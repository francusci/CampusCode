# CampusCode en Netlify.
# Netlify sirve el frontend compilado y reenvía /api/* al backend de Render.
# El backend debe estar publicado en la URL indicada abajo.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Backend Node/Express/SQLite en Render.
[[redirects]]
  from = "/api/*"
  to = "https://campuscode-co.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback para las rutas de React Router (/login, /registro, /dashboard, etc.).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
